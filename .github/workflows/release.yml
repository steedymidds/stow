name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to attach the builds to"
        required: true
        default: "v1.0.0"
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - name: Build Stow.app
        working-directory: app
        run: STOW_NO_INSTALL=1 zsh ./build.sh "${TAG#v}"
      - name: Package
        run: |
          cd app/build && ditto -c -k --keepParent Stow.app ../../Stow-macos.zip
          cd ../.. && zip -r Stow-engine.zip engine -x "engine/node_modules/*"
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          files: |
            Stow-macos.zip
            Stow-engine.zip
